<body>
    <div id="nav">
        <div class="edge et"></div>
        <div class="edge eb"><div id="wr-widget"></div></div>
        <div class="edge el"></div>
    </div>
    <div id="content">
        This is a collection of the music that that I've saved through Spotify over the past ~10 years<br>
        <!-- I used a website (<a href="https://odesli.co/">Odesli</a>) to get as many alternative links for each of the songs in this playlist. <br> -->
        <br><br>

        <hr>
        <div id="song_table"></div>
    </div>
    <script src="../template/template.js"></script>
    <script>
        fetch('/files/srv/html/spotify_liked_table.html')
        .then(res=>res.text())
        .then(data => {
            let song_table = document.getElementById('song_table');
            song_table.innerHTML = data;


            document.querySelectorAll('.listen-btn').forEach(btn=>{
                btn.addEventListener('click', evt => {
                    const template = btn.nextSibling;
                    console.log(template, btn, btn.parentElement)
                    const clone = document.importNode(template.content, true);
                    // btn.node.innerHTML = '';
                    btn.parentNode.previousElementSibling.append(clone);
                    
                });
            })
        })
    </script>
</body>
