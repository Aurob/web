<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TeX → CHTML (MathJax)</title>

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      packages: {'[+]': ['ams']}
    },
    chtml: {
      scale: 1.1
    }
  };
</script>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<style>
  body {
    margin: 0;
    display: flex;
    height: 100vh;
    font-family: system-ui, sans-serif;
  }
  textarea {
    width: 50%;
    padding: 12px;
    font-family: monospace;
    font-size: 14px;
    border: none;
    outline: none;
  }
  #output {
    width: 50%;
    padding: 16px;
    overflow: auto;
    background: #fafafa;
  }
</style>
</head>

<body>

<textarea id="input">
\section*{Hello World}

This is live-rendered TeX (not compiled LaTeX).

Inline math: $e^{i\pi} + 1 = 0$

Display math:
$$
x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}
$$

Matrices:
$$
\begin{bmatrix}
1 & 2 \\
3 & 4
\end{bmatrix}
$$
</textarea>

<div id="output"></div>

<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');

  function render() {
    output.innerHTML = input.value;
    MathJax.typesetPromise([output]);
  }

  input.addEventListener('input', render);
  render();
</script>

</body>
</html>
