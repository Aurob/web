image: alpine/edge
packages:
  - hut
  - zola
oauth: pages.sr.ht/PAGES:RW
environment:
  site: rau.srht.site
sources:
  - https://git.sr.ht/~rau/web
tasks:
  - build: |
      cd web
      zola build
  - package: |
      cd web
      tar -C public -cvz . > ../site.tar.gz
  - upload: |
      hut pages publish -d $site site.tar.gz