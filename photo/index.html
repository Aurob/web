    <script>
        function shuffle(array) {
            let currentIndex = array.length;

            // While there remain elements to shuffle...
            while (currentIndex != 0) {

                // Pick a remaining element...
                let randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;

                // And swap it with the current element.
                [array[currentIndex], array[randomIndex]] = [
                array[randomIndex], array[currentIndex]];
            }
        }

        const images = document.getElementById('images');
        var track_ids = [];

        shuffle(IMAGE_IDS);
        IMAGE_IDS.forEach(img_id => {
            let img = document.createElement('img');
            img.loading = 'lazy';
            img.src = `https://imagedelivery.net/LJW9TBw5H2BwGc8uUBxFZA/${img_id}/thumbsm`;
            images.append(img);
            img.onclick = function(){
                if(!track_ids.includes(img_id)) {
                    track_ids.push(img_id);
                }                
                window.open(`https://imagedelivery.net/LJW9TBw5H2BwGc8uUBxFZA/${img_id}/public`, '_blank');

            };

    })
