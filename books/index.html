    <div id="nav">
        <div class="edge et"></div>
        <div class="edge eb"><div id="wr-widget"></div></div>
        <div class="edge el"></div>
    </div>
    <div id="content">
        <p>
            This is a collection of books that I either own, or owned at some point.
        </p>
        <hr>
    </div>
    <script>
        let content = document.getElementById('content');
        BOOKS.forEach(book => {
            console.log(book);
            let book_item = document.createElement('div');
            let a = document.createElement('a');
            a.href = `https://openlibrary.org/${book['key']}`
            a.innerText = book['title'];
            a.target = '_blank';
            book_item.append(a)
            content.append(book_item)
        })
    </script>
